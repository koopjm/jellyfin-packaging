name: Custom Jellyfin 10.11.8 Build & Package

on:
  workflow_dispatch:

jobs:
  build-deb:
    name: Build Ubuntu 24.04 (Noble) .deb Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Packaging Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Custom Jellyfin Server
        uses: actions/checkout@v4
        with:
          repository: 'koopjm/jellyfin'
          ref: 'custom-10.11.8'
          path: 'jellyfin-server'
          fetch-depth: 0

      - name: Checkout Custom Jellyfin Web
        uses: actions/checkout@v4
        with:
          repository: 'koopjm/jellyfin-web'
          ref: 'custom-web-10.11.8'
          path: 'jellyfin-web'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install packaging gitpython pyyaml

      - name: Build Debian Packages (Ubuntu Noble amd64)
        run: |
          python3 build.py 10.11.8 ubuntu amd64 noble

      - name: Check Output Packages
        run: |
          ls -la out/
          ls -la out/ubuntu/ || true

      - name: Upload .deb Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-10.11.8-ubuntu-noble-deb
          path: 'out/ubuntu/*.deb'
          if-no-files-found: error

  build-docker:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Packaging Repo
        uses: actions/checkout@v4

      - name: Checkout Custom Jellyfin Server
        uses: actions/checkout@v4
        with:
          repository: 'koopjm/jellyfin'
          ref: 'custom-10.11.8'
          path: 'jellyfin-server'

      - name: Checkout Custom Jellyfin Web
        uses: actions/checkout@v4
        with:
          repository: 'koopjm/jellyfin-web'
          ref: 'custom-web-10.11.8'
          path: 'jellyfin-web'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            JELLYFIN_VERSION=10.11.8
            DOTNET_VERSION=9.0
            NODEJS_VERSION=20
            PACKAGE_ARCH=amd64
            DOTNET_ARCH=x64
            IMAGE_ARCH=amd64
            TARGET_ARCH=amd64
          push: true
          tags: |
            ghcr.io/koopjm/jellyfin:custom-10.11.8
            ghcr.io/koopjm/jellyfin:latest
